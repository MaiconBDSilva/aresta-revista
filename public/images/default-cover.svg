<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @font-face {
        font-family: 'Svetze';
        src: url('/fonts/Svetze.otf') format('opentype');
      }
      .brand-text {
        font-family: 'Svetze', Georgia, 'Times New Roman', serif;
        font-size: 72px;
        font-weight: 400;
        fill: #09090b;
        letter-spacing: -0.02em;
      }
      .brand-dot {
        fill: #b91c1c;
      }
      .pill-shadow {
        filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.25));
      }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Fundo Carmim Aresta -->
  <rect width="1200" height="675" fill="#B91C1C" />

  <!-- Padrão Sutil de Textura Editorial Geométrica -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="600" cy="337.5" r="280" />
    <circle cx="600" cy="337.5" r="420" />
    <line x1="0" y1="337.5" x2="1200" y2="337.5" />
    <line x1="600" y1="0" x2="600" y2="675" />
  </g>

  <!-- Pílula Branca Centralizada -->
  <g filter="url(#shadow)">
    <rect x="420" y="277.5" width="360" height="120" rx="60" fill="#FFFFFF" />
  </g>

  <!-- Tipografia aresta. dentro da pílula -->
  <!-- 'aresta' em grafite escuro com ponto carmim -->
  <text x="600" y="360" text-anchor="middle" class="brand-text">
    <tspan fill="#09090b">aresta</tspan><tspan fill="#B91C1C">.</tspan>
  </text>
</svg>

